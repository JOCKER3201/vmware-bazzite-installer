[package]
name = "vmware-sysext-builder"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Graphical builder of a systemd-sysext image (vmware.raw) from a VMware Workstation .bundle — for Bazzite and other Fedora Atomic systems"

[dependencies]
eframe = "0.29"
rfd = "0.15"
anyhow = "1"
tar = "0.4"
libc = "0.2"

[profile.release]
lto = true
strip = true
